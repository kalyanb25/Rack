# NVIDIA GPU for Ollama. `rack up` adds this automatically when it sees an NVIDIA GPU.
# Needs the NVIDIA Container Toolkit on Linux (https://docs.ollama.com/docker), or Docker Desktop + WSL2 on Windows.
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
