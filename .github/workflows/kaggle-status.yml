name: kaggle-status

# Read-only peek at a model's Kaggle training job: status, the end of its log (or every line
# matching a search), and your remaining GPU quota. Safe to run any time; it uses no GPU.
# Actions > kaggle-status > Run workflow.

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model project whose Kaggle training job to inspect
        required: true
        default: dc-ops
      find:
        description: "Optional: show every log line matching this regex (case-insensitive) instead of the last 60"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  status:
    name: Kaggle job for ${{ inputs.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODEL: ${{ inputs.model }}
      FIND: ${{ inputs.find }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME || vars.KAGGLE_USERNAME }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - run: python -m pip install -q kaggle six
      - name: Status, log and quota
        run: |
          [ -n "$KAGGLE_API_TOKEN" ] || unset KAGGLE_API_TOKEN
          [ -n "$KAGGLE_KEY" ] || unset KAGGLE_KEY
          ref="$KAGGLE_USERNAME/rack-train-$MODEL"
          echo "== status"; kaggle kernels status "$ref" || true
          echo "== GPU quota"; kaggle quota || true
          kaggle kernels logs "$ref" > log.json 2>&1 || true
          python - <<'EOF'
          import json, os, re
          raw = open("log.json", encoding="utf-8", errors="replace").read()
          try:
              entries = json.loads(raw)
          except json.JSONDecodeError:
              print("== job log (raw)")
              print(raw[-6000:])
              raise SystemExit(0)
          find = os.environ.get("FIND", "").strip()
          if find:
              rx = re.compile(find, re.I)
              entries = [e for e in entries if rx.search(str(e.get("data", "")))][:400]
              print(f"== {len(entries)} log line(s) matching /{find}/")
          else:
              print(f"== last lines of the job log ({len(entries)} total)")
              entries = entries[-60:]
          for e in entries:
              t = float(e.get("time") or 0)
              print(f"{int(t // 60):4d}m{int(t % 60):02d}s  {str(e.get('data', '')).rstrip()[:400]}")
          EOF
